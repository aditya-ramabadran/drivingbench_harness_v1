[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "drivingbench-harness"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "huggingface_hub>=0.34,<2", "mcp>=1.12,<2", "pillow>=11,<13", "pydantic>=2.10,<3", "uvicorn>=0.34,<1", "tomlkit>=0.13,<1"]

[project.scripts]
drivingbench = "drivingbench.gateway.cli:main"
drivingbench-sandbox = "drivingbench.mcp.tools:main"

[tool.setuptools]
packages = ["drivingbench", "drivingbench.controller", "drivingbench.device", "drivingbench.gateway", "drivingbench.mcp", "drivingbench.shared", "drivingbench.ui"]
package-dir = {drivingbench = "."}

[tool.setuptools.package-data]
"drivingbench.ui" = ["*.html", "*.css", "*.js"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.11,<1",
    "numpy>=1.26,<3",
    "pycapnp>=2,<3",
    "setproctitle>=1.3,<2",
    "zstandard>=0.25,<1",
    "opendbc>=0.3.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["native"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
